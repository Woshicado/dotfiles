# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @treemux-tree-nvim-init-file "$HOME/.config/tmux/plugins/treemux/configs/treemux_init.lua"
set -g @plugin 'kiyoon/treemux'
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g mouse on
set -g mode-keys vi

# tmux open config
set-environment -g EDITOR "nvim"
set-environment -g VISUAL "nvim"
set -g @open-S 'https://www.duckduckgo.com/?q='
set -g @open 'x'
set -g @open-editor 'o'

# copycat
set -g @copycat_search_G '^(?! )(.+?)(?= --- )'

# Extended ctrl keys like C-i
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys always
set-option -g xterm-keys on
set-option -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Bold a background window that rang the bell.
set -g monitor-bell on
set -g bell-action any
set extended-keys-format "csi-u" # csi-u, xterm

# Make hyperlink clickable (hold shift)
set -ga terminal-features "*:hyperlinks"

### UKIYO (kanagawa)
#
# Colours and variant both come from `theme-switch`, which is the single place the
# tmux palette is defined -- ukiyo's own kanagawa variants do not match Neovim
# (wave uses a lighter status background, and lotus sets `text` and `bg_pane` to
# the same colour, making its text invisible). Running it here, before tpm loads
# the plugin, seeds the options for the persisted light/dark state.
run-shell 'theme-switch tmux-options'

set -g status on
run-shell 'tmux list-sessions 2>/dev/null | cut -d: -f1 | while read -r s; do tmux set-option -t "$s" -u status 2>/dev/null; done; tmux set-option -gu "status-format[1]" 2>/dev/null; tmux set-option -gu "status-format[2]" 2>/dev/null; true'

set -g @ukiyo-show-powerline true
set -g @ukiyo-show-empty-plugins false

# Breathing room between window entries
set -g window-status-separator "  "

set -g @ukiyo-left-icon "#(whoami)@#H"

# Available modules:
#   attached-clients battery continuum cpu-usage cwd disk-usage fossil git
#   gpu-power-draw gpu-ram-usage gpu-usage hg kubernetes-context mpc network
#   network-bandwidth network-ping network-vpn openconnect playerctl ram-usage
#   spotify-tui ssh-session synchronize-panes terraform time tmux-ram-usage weather
# plus `custom:/abs/path/to/script` for anything else.
set -g @ukiyo-plugins "none"
###

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind-key -n 'M-g' run-shell -b "${HOME}/.local/bin/tmux-toggle-term float"

# Open panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Balance panes (default binding is prefix-E)
bind b select-layout -E

# JUMPS WITH OPT AND COMMAND ON MACOS
bind -n M-Left send-keys 'M-b'  # Move left by word
bind -n M-Right send-keys 'M-f'  # Move right by word

# Set 256-color scheme (needed for e.g. nvim ig)
# set -g default-terminal "xterm-kitty"  # breaks C-i
set -g default-terminal "tmux-256color"  # breaks Cmd+v because of sequences
# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm*:Tc"

# Set the base index for windows to 1 instead of 0.
set -g base-index 1
setw -g pane-base-index 1

set -g pane-border-lines single
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format ' .#P (#D) #{pane_current_command} '

# Copy on select
unbind-key -T copy-mode-vi MouseDragEnd1Pane
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'u' send-keys BvE

# Install tmux plugin manager if not installed yet
if "test ! -d $HOME/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm && $HOME/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$HOME/.config/tmux/plugins/tpm/tpm"

# Must come after tpm: ukiyo rewrites the pane border styles when it renders, and
# `run` (run-shell without -b) blocks until tpm has finished loading the plugins.
run-shell 'theme-switch tmux-borders'

# bind-key -n Home send Escape "OH"
# bind-key -n End send Escape "OF"

set -g set-clipboard on


