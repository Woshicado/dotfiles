[env]
_.file = ".env"
PROJECT_NAME = "dotfiles"
PYTHON_VERSION = "3.11"

[tasks]

[tasks.stow]
description = "Install all optional dependencies"
alias = "s"
run = "stow --no-folding --dotfiles -R . --adopt"

[tasks.skills]
description = "Link custom agent skills and install upstream ones (skills submodule)"
run = """
  # Fetch the (private) submodule on first use only; later runs keep its branch.
  if [ ! -f skills/install.sh ]; then
    git submodule update --init skills && git -C skills switch -q main
  fi
  ./skills/install.sh
"""

[tasks.skills-update]
description = "Update upstream agent skills via the skills CLI"
run = "npx -y skills update -g -y"

[tasks.info]
description = "Print project information"
alias = "i"
run = """
  # Project information

  echo "Project: $PROJECT_NAME"
  echo "------"
"""
